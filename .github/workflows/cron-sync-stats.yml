name: Cron - Sync Stats

# Hourly, not daily: sync-stats processes only the stalest few leagues per run
# (Vercel Hobby's 60s function limit), so it needs several runs to cover all 30.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/sync-stats
        run: |
          curl -sf --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/sync-stats"
