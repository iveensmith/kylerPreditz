name: Cron - Sync Stats

# Fallback only - sync-stats runs on cron-job.org every 30 min (see
# docs/cron-setup.md), which honours the schedule where GitHub does not.
# /api/cron/sync-stats now just refreshes standings + top scorers (fast);
# per-team stats moved to the separate Sync Team Stats workflow.
# Disabled in the Actions tab; kept for manual workflow_dispatch.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/sync-stats
        run: |
          curl -sf --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/sync-stats"
