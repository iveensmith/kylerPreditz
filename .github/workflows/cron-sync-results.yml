name: Cron - Sync Results

# Scheduled trigger removed: sync-results now runs from cron-job.org every ~3 min
# (see docs/cron-setup.md). This workflow is kept only as a manual fallback for
# when that external scheduler is down - run it from the Actions tab.
on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/sync-results
        run: |
          curl -sf --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/sync-results"
